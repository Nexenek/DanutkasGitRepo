<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <title>Frajerstwo</title>
    <link rel="stylesheet" type="text/css" href="styl8.css">
</head>
<body>
    <aside id="lewy1">
        <a href="index.html"><h1>SALON FRYZJERSKI</h1></a>
    </aside>
    <aside id="prawy1">
        <a href="fryzura.html"><h4>Ceny strzyżenia</h4></a>
        <table>
            <tr><th>Długość włosów</th><th>Cena</th></tr>
            <tr><td>Krótkie</td><td>25</td></tr>
            <tr><td>Średnie</td><td>30</td></tr>
            <tr><td>Półdługie</td><td>40</td></tr>
            <tr><td>Długie</td><td>50</td></tr>
        </table>
    </aside>
    <aside id="lewy2">
        <h2>PROMOCJA</h2>
        <input type="radio" id="krotkie" name="promocja" value="krotkie"> Krótkie<br>
        <input type="radio" id="srednie" name="promocja" value="srednie"> Średnie<br>
        <input type="radio" id="poldlugie" name="promocja" value="poldlugie"> Półdługie<br>
        <input type="radio" id="dlugie" name="promocja" value="dlugie"> Długie<br>
        <button onclick="odkryj()">Odkryj promocję</button>
        <p id="wynik"></p>
    </aside>
    <script>
        function odkryj() {
            let wynik = document.getElementById("wynik");
            let cena = 0;

            const krotkie = document.getElementById('krotkie');
            const srednie = document.getElementById('srednie');
            const poldlugie = document.getElementById('poldlugie');
            const dlugie = document.getElementById('dlugie');

            if (krotkie.checked) {
                cena = 25 - 10;
            }
            else if (srednie.checked) {
                cena = 30 - 10;
            }
            else if (poldlugie.checked) {
                cena = 40 - 10;
            }
            else if (dlugie.checked) {
                cena = 50 - 10;
            }
        
            wynik.innerHTML = "<p>cena promocyjna: " + cena + "</p>";
        }
    </script>
    <aside id="prawy2">
        <img src="obraz1.jpg" alt="Fryzjerka">
    </aside>
    <aside id="lewy3">
        <p>Witaj! Miło nam, że odwiedziłeś nasz salon. Sprawdź promocje!</p>
        <h4>Kontakt: 444 555 666</h4>
    </aside>
    <footer>
        <p>Autor: 0000000000</p>
    </footer>
</body>
</html>
